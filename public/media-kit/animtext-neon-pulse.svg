<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 140" width="320" height="140">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b1"/>
      <feGaussianBlur stdDeviation="8" in="SourceGraphic" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="320" height="140" fill="#0A0A0A"/>
  <g font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-weight="900" text-anchor="middle" font-size="44" letter-spacing="-1" filter="url(#glow)">
    <text x="160" y="88" fill="#FF2D2D">TRANSFORM</text>
  </g>
  <g font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-weight="900" text-anchor="middle" font-size="44" letter-spacing="-1">
    <text x="160" y="88" fill="#FFFFFF">TRANSFORM</text>
  </g>
</svg>
